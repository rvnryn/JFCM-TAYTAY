<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JFCM Taytay - Modules</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../dashboard/shared-styles.css" />
    <link rel="stylesheet" href="modules.css" />
    <link rel="icon" type="image/png" href="../images/logo_green.png" />
    <link rel="shortcut icon" href="../images/logo_green.png" />
  </head>
  <body>
    <script>if(!localStorage.getItem('access_token')){window.location.replace('../login/login.html');}</script>
    <header>
      <!--Navigation Bar-->
      <nav class="navbar">
        <div class="burger" id="burger">☰</div>
        <div class="navbar-title">JFCM Taytay</div>
      </nav>

      <div class="sidebar" id="sidebar">
        <div class="sidebar-logo">
          <img src="../images/jfcm_white.png" alt="JFCM Logo" />
        </div>

        <div
          style="
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 12px;
            margin-bottom: 20px;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
          "
        >
          <div
            id="sidebar-user-avatar"
            style="
              width: 48px;
              height: 48px;
              border-radius: 50%;
              background-color: rgba(255, 255, 255, 0.2);
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 22px;
              color: #fff;
              flex-shrink: 0;
            "
          >
            <i class="fas fa-user"></i>
          </div>
          <div style="flex: 1; min-width: 0">
            <p
              id="sidebar-user-name"
              style="
                margin: 0;
                color: #fff;
                font-family: &quot;Poppins&quot;, sans-serif;
                font-size: 13px;
                font-weight: 600;
                word-break: break-word;
                line-height: 1.2;
              "
            >
              Loading...
            </p>
            <p
              id="sidebar-user-role"
              style="
                margin: 0;
                color: rgba(255, 255, 255, 0.8);
                font-family: &quot;Poppins&quot;, sans-serif;
                font-size: 11px;
                word-break: break-word;
              "
            >
              User
            </p>
          </div>
        </div>

        <div class="sidebar-section">
          <h3 class="sidebar-section-title">MENU</h3>
          <a href="../dashboard/dashboard.html"
            ><i class="fas fa-chart-line"></i>Dashboard</a
          >
          <a href="../teachings/index.html"
            ><i class="fas fa-book"></i>Teachings</a
          >
          <a href="../jfcm-talks/index.html"
            ><i class="fas fa-comments"></i>JFCM Talks</a
          >
        </div>

        <div class="sidebar-section">
          <h3 class="sidebar-section-title">SCHOOL OF WORKERS</h3>
          <div class="sidebar-dropdown">
            <button class="sidebar-dropdown-toggle" id="modulesToggle">
              <i class="fas fa-scroll"></i>Modules
              <span class="dropdown-arrow">▼</span>
            </button>
            <div class="sidebar-submenu" id="modulesSubmenu">
              <a href="../sow1/index.html"
                ><i class="fas fa-folder"></i>SOW 1</a
              >
              <a href="../sow2/index.html"
                ><i class="fas fa-folder"></i>SOW 2</a
              >
            </div>
          </div>
        </div>

        <div class="sidebar-section">
          <h3 class="sidebar-section-title">SETTINGS</h3>
          <a href="../profile/index.html"
            ><i class="fas fa-user-circle"></i>Profile</a
          >
          <a href="../user-management/index.html"
            class="admin-only"><i class="fas fa-users"></i>User Management</a
          >
          <a href="../login/login.html" class="logout-btn"
            ><i class="fas fa-sign-out-alt"></i>Logout</a
          >
        </div>
      </div>
    </header>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="dashboard-main">
      <h1 class="dashboard-title">School of Workers Modules</h1>

      <div class="cards-grid">
        <a href="../sow1/index.html" class="card-link">
          <div class="card">
            <div class="card-icon">
              <i class="fas fa-book-open"></i>
            </div>
            <h3>SOW 1</h3>
            <p>School of Workers Level 1 Materials</p>
          </div>
        </a>

        <a href="../sow2/index.html" class="card-link">
          <div class="card">
            <div class="card-icon">
              <i class="fas fa-book-open"></i>
            </div>
            <h3>SOW 2</h3>
            <p>School of Workers Level 2 Materials</p>
          </div>
        </a>
      </div>
    </main>

    <script src="../config.js"></script>
    <script src="../dashboard/shared-script.js"></script>
    <script src="modules.js"></script>
  </body>
</html>
