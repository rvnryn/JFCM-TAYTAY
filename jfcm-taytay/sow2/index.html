<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JFCM Taytay - SOW 2</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../dashboard/shared-styles.css" />
    <link rel="stylesheet" href="sow2.css" />
    <link rel="icon" type="image/png" href="./images/logo_green.png" />
    <link rel="shortcut icon" href="./images/logo_green.png" />
  </head>
  <body>
    <script>if(!localStorage.getItem('access_token')){window.location.replace('../login/login.html');}</script>
    <header>
      <!--Navigation Bar-->
      <nav class="navbar">
        <div class="burger" id="burger">☰</div>
        <div class="navbar-title">JFCM Taytay</div>
      </nav>

      <div class="sidebar" id="sidebar">
        <div class="sidebar-logo">
          <img src="../images/jfcm_white.png" alt="JFCM Logo" />
        </div>

        <div
          style="
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 12px;
            margin-bottom: 20px;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
          "
        >
          <div
            id="sidebar-user-avatar"
            style="
              width: 48px;
              height: 48px;
              border-radius: 50%;
              background-color: rgba(255, 255, 255, 0.2);
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 22px;
              color: #fff;
              flex-shrink: 0;
            "
          >
            <i class="fas fa-user"></i>
          </div>
          <div style="flex: 1; min-width: 0">
            <p
              id="sidebar-user-name"
              style="
                margin: 0;
                color: #fff;
                font-family: &quot;Poppins&quot;, sans-serif;
                font-size: 13px;
                font-weight: 600;
                word-break: break-word;
                line-height: 1.2;
              "
            >
              Loading...
            </p>
            <p
              id="sidebar-user-role"
              style="
                margin: 0;
                color: rgba(255, 255, 255, 0.8);
                font-family: &quot;Poppins&quot;, sans-serif;
                font-size: 11px;
                word-break: break-word;
              "
            >
              User
            </p>
          </div>
        </div>

        <div class="sidebar-section">
          <h3 class="sidebar-section-title">MENU</h3>
          <a href="../dashboard/dashboard.html"
            ><i class="fas fa-chart-line"></i>Dashboard</a
          >
          <a href="../teachings/index.html"
            ><i class="fas fa-book"></i>Teaching</a
          >
          <a href="../jfcm-talks/index.html"
            ><i class="fas fa-comments"></i>JFCM Talks</a
          >
        </div>

        <div class="sidebar-section">
          <h3 class="sidebar-section-title">SCHOOL OF WORKERS</h3>
          <div class="sidebar-dropdown">
            <button class="sidebar-dropdown-toggle" id="modulesToggle">
              <i class="fas fa-scroll"></i>Modules
              <span class="dropdown-arrow">▼</span>
            </button>
            <div class="sidebar-submenu" id="modulesSubmenu">
              <a href="../modules/index.html"
                ><i class="fas fa-folder"></i>Modules</a
              >
              <a href="../sow1/index.html"
                ><i class="fas fa-folder"></i>SOW 1</a
              >
              <a href="../sow2/index.html" class="active"
                ><i class="fas fa-folder"></i>SOW 2</a
              >
            </div>
          </div>
        </div>

        <div class="sidebar-section">
          <h3 class="sidebar-section-title">SETTINGS</h3>
          <a href="../profile/index.html"
            ><i class="fas fa-user-circle"></i>Profile</a
          >
          <a href="../user-management/index.html"
            class="admin-only"><i class="fas fa-users"></i>User Management</a
          >
          <a href="../login/login.html" class="logout-btn"
            ><i class="fas fa-sign-out-alt"></i>Logout</a
          >
        </div>
      </div>
    </header>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="dashboard-main">
      <a href="../modules/index.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back to Modules
      </a>
      <h1 class="dashboard-title">SOW 2</h1>

      <div id="connectedGoogleAccountInfo" class="gdrive-account-info"></div>

      <div class="content-section">
        <div class="search-container" style="position: relative">
          <input
            type="text"
            class="search-bar"
            id="searchInput"
            placeholder="Search titles..."
            autocomplete="off"
          />
          <i class="fas fa-search search-icon"></i>
          <div
            id="searchSuggestions"
            class="search-suggestions"
            style="display: none"
          ></div>
        </div>

        <div class="controls-container">
          <div class="filters">
            <div class="filter-group">
              <label class="filter-label">Topic</label>
              <select id="topicFilter" class="filter-select">
                <option value="all">All Topics</option>
              </select>
            </div>

            <div class="filter-group">
              <label class="filter-label">Sort</label>
              <select id="sortFilter" class="filter-select">
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
              </select>
            </div>
          </div>

          <button class="upload-btn admin-only" id="uploadBtn">
            <i class="fas fa-upload"></i> Upload
          </button>
        </div>
      </div>

      <div class="content-list"></div>
    </main>

    <!-- Upload Modal -->
    <div id="uploadModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2><i class="fas fa-cloud-upload-alt"></i> Upload SOW 2 Module</h2>
          <span class="close-modal">&times;</span>
        </div>

        <div class="modal-body">
          <!-- File Selection Area -->
          <div class="upload-section">
            <h3>Select File</h3>
            <div class="file-drop-zone" id="fileDropZone">
              <i class="fas fa-file-upload"></i>
              <p>Drag & drop file here or click to browse</p>
              <input type="file" id="modalFileInput" style="display: none" />
              <div
                id="selectedFileInfo"
                class="selected-file-info"
                style="display: none"
              >
                <i class="fas fa-file"></i>
                <span id="selectedFileName"></span>
                <button
                  type="button"
                  class="remove-file-btn"
                  id="removeFileBtn"
                >
                  <i class="fas fa-times"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Title Input -->
          <div class="upload-section">
            <h3>Title <span style="color: #e74c3c">*</span></h3>
            <input
              type="text"
              id="sow2Title"
              class="form-input"
              placeholder="Enter title..."
              maxlength="200"
              required
            />
          </div>
          <!-- Topic Input -->
          <div class="upload-section">
            <h3>Topic <span style="color: #e74c3c">*</span></h3>
            <input
              type="text"
              id="sow2Topic"
              class="form-input"
              placeholder="Enter topic (e.g. Faith, Worship, etc.)"
              maxlength="100"
              required
            />
          </div>

          <!-- Folder Selection Area -->
          <div class="upload-section" id="folderSelectSection">
            <h3>Select Google Drive Folder</h3>
            <!-- Connect Google Drive button (shown when NOT authenticated) -->
            <div id="gdriveAuthSection" style="margin: 16px 0">
              <button type="button" class="auth-gdrive-btn" id="authGdriveBtn">
                <i class="fab fa-google"></i> Connect Google Drive
              </button>
            </div>
            <!-- Picker and helpers (shown when authenticated) -->
            <button
              type="button"
              class="modal-btn upload-btn-modal picker-green-btn"
              id="openPickerBtn"
              style="
                margin-top: 8px;
                display: flex;
                align-items: center;
                gap: 8px;
              "
              disabled
            >
              <i class="fab fa-google-drive" style="color: #fff"></i> Pick from
              Google Drive
            </button>
            <span
              id="selectedFolderName"
              style="
                display: block;
                margin-top: 8px;
                color: #4285f4;
                font-weight: 600;
              "
            ></span>
            <div id="gdriveFolderHelper" style="display: none; margin: 16px 0">
              <div
                style="
                  display: flex;
                  gap: 10px;
                  flex-wrap: wrap;
                  margin-bottom: 8px;
                "
              >
                <button
                  id="createGdriveFolderBtn"
                  type="button"
                  class="modal-btn upload-btn-modal folder-purple-btn"
                  style="display: flex; align-items: center; gap: 8px"
                >
                  <i class="fas fa-folder-plus" style="color: #fff"></i> Create
                  Folder in Google Drive
                </button>
                <button
                  id="refreshGdriveFoldersBtn"
                  type="button"
                  class="modal-btn"
                  style="
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    background: #e8eaed;
                    color: #5f6368;
                  "
                >
                  <i class="fas fa-sync-alt"></i> Refresh Folders
                </button>
              </div>
            </div>
          </div>

          <!-- Options -->
          <div class="upload-section">
            <label class="checkbox-label">
              <input type="checkbox" id="makePublicCheckbox" checked />
              <span>Make file publicly accessible</span>
            </label>
          </div>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="modal-btn cancel-btn"
            id="cancelUploadBtn"
          >
            Cancel
          </button>
          <button
            type="button"
            class="modal-btn upload-btn-modal"
            id="confirmUploadBtn"
            disabled
          >
            <i class="fas fa-upload"></i> Upload
          </button>
        </div>
      </div>
    </div>

    <!-- Google Picker API -->
    <script
      type="text/javascript"
      src="https://apis.google.com/js/api.js"
    ></script>

    <script src="../config.js"></script>
    <script src="sow2.js"></script>
    <script src="../dashboard/shared-script.js"></script>
  </body>
</html>
